<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Request Access — FEMA Flood Certificate Generator</title>
  <link rel="stylesheet" href="/static/css/main.css" />
  <style>
    .auth-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #003366 0%, #0050a0 100%);
      padding: 24px;
    }
    .auth-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.22);
      width: 100%;
      max-width: 540px;
      overflow: hidden;
    }
    .auth-card-header {
      background: linear-gradient(135deg, #003366 0%, #0050a0 100%);
      padding: 28px 36px 22px;
      text-align: center;
      color: #fff;
    }
    .auth-card-header h1 { font-size: 1.15rem; font-weight: 700; margin: 0; }
    .auth-card-header p  { font-size: 0.8rem; opacity: 0.75; margin-top: 5px; }
    .auth-card-body { padding: 28px 36px 32px; }
    .auth-success {
      background: #e6f4ed;
      border: 1.5px solid #1a7a4a;
      color: #0f4f2e;
      border-radius: 6px;
      padding: 16px 18px;
      font-size: 0.88rem;
      margin-bottom: 20px;
      line-height: 1.6;
    }
    .auth-error {
      background: #fdf0ef;
      border: 1.5px solid #c0392b;
      color: #c0392b;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 0.85rem;
      margin-bottom: 16px;
    }
    .auth-error ul { margin: 4px 0 0 16px; padding: 0; }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }
    .auth-group { margin-bottom: 14px; }
    .form-row .auth-group { margin-bottom: 0; }
    .auth-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      color: #003366;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 5px;
    }
    .auth-group input {
      width: 100%;
      padding: 11px 13px;
      border: 1.5px solid #e8ecf0;
      border-radius: 6px;
      font-size: 0.92rem;
      color: #1e2530;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      box-sizing: border-box;
      font-family: inherit;
    }
    .auth-group input:focus {
      border-color: #0050a0;
      box-shadow: 0 0 0 3px rgba(0,80,160,0.12);
    }
    .auth-group input.input-error {
      border-color: #c0392b;
    }
    .auth-group .field-hint {
      font-size: 0.72rem;
      color: #9aa3ad;
      margin-top: 4px;
    }
    .section-label {
      font-size: 0.72rem;
      font-weight: 700;
      color: #9aa3ad;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin: 18px 0 10px;
      border-bottom: 1px solid #e8ecf0;
      padding-bottom: 6px;
    }
    .auth-btn {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #0050a0 0%, #003366 100%);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
      margin-top: 6px;
    }
    .auth-btn:hover { opacity: 0.9; }
    .auth-footer {
      margin-top: 18px;
      text-align: center;
      font-size: 0.82rem;
      color: #5a6470;
    }
    .auth-footer a { color: #0050a0; text-decoration: none; font-weight: 600; }
    .auth-footer a:hover { text-decoration: underline; }
    .notice {
      background: #e8f0fb;
      border-left: 3px solid #003366;
      padding: 10px 14px;
      font-size: 0.8rem;
      color: #3a4450;
      border-radius: 0 6px 6px 0;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    @media (max-width: 480px) {
      .form-row { grid-template-columns: 1fr; }
      .auth-card-body { padding: 22px 20px 28px; }
    }
  </style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-card-header">
      <h1>🌊 Request Platform Access</h1>
      <p>FEMA Flood Certificate Generator</p>
    </div>
    <div class="auth-card-body">

      
      <div class="auth-success">
        <strong>✅ Request submitted!</strong><br />
        Your access request has been received. You will be notified once approved.<br />
        A confirmation email has been sent to your address.
      </div>
      <div class="auth-footer">
        <a href="/login">← Back to Sign In</a>
      </div>

      
    </div>
  </div>
</div>

<script>
// Auto-format phone number as (XXX) XXX-XXXX
const phoneInput = document.getElementById('contact_number');
if (phoneInput) {
  phoneInput.addEventListener('input', function() {
    let val = this.value.replace(/\D/g, '').slice(0, 10);
    if (val.length >= 7) {
      this.value = '(' + val.slice(0,3) + ') ' + val.slice(3,6) + '-' + val.slice(6);
    } else if (val.length >= 4) {
      this.value = '(' + val.slice(0,3) + ') ' + val.slice(3);
    } else if (val.length > 0) {
      this.value = '(' + val;
    }
  });
}

// Client-side validation before submit
document.getElementById('reqForm') && document.getElementById('reqForm').addEventListener('submit', function(e) {
  const fields = ['first_name','last_name','email','contact_number','company_name','company_address'];
  let ok = true;
  fields.forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.remove('input-error');
    if (!el.value.trim()) { el.classList.add('input-error'); ok = false; }
  });

  const emailEl = document.getElementById('email');
  if (emailEl && emailEl.value && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailEl.value)) {
    emailEl.classList.add('input-error'); ok = false;
  }

  const phoneEl = document.getElementById('contact_number');
  if (phoneEl && phoneEl.value && phoneEl.value.replace(/\D/g,'').length !== 10) {
    phoneEl.classList.add('input-error'); ok = false;
  }

  if (!ok) e.preventDefault();
});
</script>
</body>
</html>
