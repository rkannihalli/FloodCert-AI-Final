kind = "web"
previewPath = "/"
title = "FEMA Flood Certificate Generator"
version = "1.0.0"

[[services]]
localPort = 8000
name = "Flood Cert App"
paths = ["/"]

[services.development]
run = "cd /home/runner/workspace/artifacts/flood-cert && python3.11 -m uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

[services.production]

[services.production.run]
args = ["bash", "-c", "cd /home/runner/workspace/artifacts/flood-cert && python3.11 -m uvicorn main:app --host 0.0.0.0 --port 8000"]

[services.production.run.env]
PORT = "8000"
