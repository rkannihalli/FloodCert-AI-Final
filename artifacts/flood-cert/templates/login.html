<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — FEMA Flood Certificate Generator</title>
  <link rel="stylesheet" href="/static/css/main.css" />
  <style>
    .auth-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #003366 0%, #0050a0 100%);
      padding: 24px;
    }
    .auth-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.22);
      width: 100%;
      max-width: 420px;
      overflow: hidden;
    }
    .auth-card-header {
      background: linear-gradient(135deg, #003366 0%, #0050a0 100%);
      padding: 32px 36px 24px;
      text-align: center;
      color: #fff;
    }
    .auth-card-header .seal {
      font-size: 2.8rem;
      margin-bottom: 10px;
    }
    .auth-card-header h1 {
      font-size: 1.2rem;
      font-weight: 700;
      line-height: 1.3;
      margin: 0;
    }
    .auth-card-header p {
      font-size: 0.8rem;
      opacity: 0.75;
      margin-top: 6px;
    }
    .auth-card-body {
      padding: 32px 36px;
    }
    .auth-error {
      background: #fdf0ef;
      border: 1.5px solid #c0392b;
      color: #c0392b;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 0.85rem;
      margin-bottom: 20px;
    }
    .auth-group {
      margin-bottom: 18px;
    }
    .auth-group label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      color: #003366;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }
    .auth-group input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #e8ecf0;
      border-radius: 6px;
      font-size: 0.95rem;
      color: #1e2530;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      box-sizing: border-box;
    }
    .auth-group input:focus {
      border-color: #0050a0;
      box-shadow: 0 0 0 3px rgba(0,80,160,0.12);
    }
    .auth-btn {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #0050a0 0%, #003366 100%);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.01em;
      transition: opacity 0.15s;
      margin-top: 4px;
    }
    .auth-btn:hover { opacity: 0.9; }
    .auth-footer {
      margin-top: 22px;
      text-align: center;
      font-size: 0.82rem;
      color: #5a6470;
    }
    .auth-footer a {
      color: #0050a0;
      text-decoration: none;
      font-weight: 600;
    }
    .auth-footer a:hover { text-decoration: underline; }
    .auth-divider {
      border: none;
      border-top: 1px solid #e8ecf0;
      margin: 20px 0;
    }
  </style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-card-header">
      <div class="seal">🌊</div>
      <h1>FEMA Flood Certificate Generator</h1>
      <p>Sign in to access the platform</p>
    </div>
    <div class="auth-card-body">

      {% if error %}
      <div class="auth-error">{{ error }}</div>
      {% endif %}

      <form method="POST" action="/login">
        <div class="auth-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email"
                 placeholder="your@email.com"
                 value="{{ email or '' }}" required autofocus />
        </div>
        <div class="auth-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password"
                 placeholder="••••••••••••" required />
        </div>
        <button type="submit" class="auth-btn">Sign In</button>
      </form>

      <hr class="auth-divider" />
      <div class="auth-footer">
        Don't have access? <a href="/request-access">Request Access</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
