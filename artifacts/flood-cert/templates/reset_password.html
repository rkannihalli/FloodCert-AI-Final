<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — FloodCert AI</title>
<link rel="stylesheet" href="/static/css/main.css">
<style>
body{background:#f3f4f6;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
.box{background:#fff;border-radius:14px;box-shadow:0 4px 16px rgba(0,0,0,.1);padding:2.5rem;width:100%;max-width:420px}
h1{font-size:1.3rem;font-weight:700;color:#1e3a5f;margin:0 0 .5rem}
.fg{margin-bottom:1.2rem}
.fg label{display:block;font-size:.8rem;font-weight:600;color:#374151;margin-bottom:.35rem}
.fg input{width:100%;padding:.6rem .9rem;border:1px solid #d1d5db;border-radius:8px;font-size:.9rem;box-sizing:border-box}
.btn{width:100%;background:#2563eb;color:#fff;padding:.65rem;border:none;border-radius:8px;font-size:.95rem;font-weight:600;cursor:pointer}
.btn:hover{background:#1d4ed8}
.ok{background:#d1fae5;color:#065f46;border:1px solid #a7f3d0;padding:.75rem 1rem;border-radius:8px;font-size:.875rem;margin-bottom:1rem}
.err{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5;padding:.75rem 1rem;border-radius:8px;font-size:.875rem;margin-bottom:1rem}
a.back{display:block;text-align:center;margin-top:1.2rem;font-size:.85rem;color:#2563eb;text-decoration:none}
</style>
</head>
<body>
<div class="box">
  <h1>🔐 Reset Password</h1>
  {% if success %}
    <div class="ok">Your password has been reset successfully!</div>
    <a class="back" href="/login">Sign in with your new password →</a>
  {% elif not valid %}
    <div class="err">{{ error or 'This reset link is invalid or has expired.' }}</div>
    <a class="back" href="/forgot-password">Request a new reset link</a>
  {% else %}
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <form method="POST" action="/reset-password">
      <input type="hidden" name="token" value="{{ token }}">
      <div class="fg">
        <label>New Password</label>
        <input type="password" name="new_password" required minlength="8" autofocus placeholder="Min 8 characters">
      </div>
      <div class="fg">
        <label>Confirm New Password</label>
        <input type="password" name="confirm_password" required minlength="8" placeholder="Repeat new password">
      </div>
      <button class="btn" type="submit">Set New Password</button>
    </form>
  {% endif %}
</div>
</body>
</html>
